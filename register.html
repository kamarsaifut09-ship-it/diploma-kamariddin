<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Register | WEPRO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/home.css" />
    <script src="js/api.js" defer></script>
    <script src="js/cart.js" defer></script>
    <script src="js/auth.js" defer></script>
  </head>
  <body class="auth-page">
    <header class="site-header">
      <button class="menu-button" type="button" aria-label="Menu" disabled><span></span><span></span><span></span></button>
      <nav class="header-nav header-nav--left" aria-label="Main navigation">
        <a href="home.html#home">Home</a>
        <a href="products.html">Products</a>
      </nav>
      <a class="brand" href="home.html#home" aria-label="WEPRO home"><img src="public/images/logo.webp" alt="WEPRO" /></a>
      <nav class="header-nav header-nav--right" aria-label="Account and bag">
        <a href="login.html" aria-current="page">Account</a>
        <a href="bag.html" data-cart-link>Bag (<span data-cart-count aria-live="polite">0</span>)</a>
      </nav>
    </header>
    <main>
      <form class="auth-form" data-auth-form="register" aria-labelledby="auth-title">
        <h1 id="auth-title">Register</h1>
        <p class="auth-context" data-auth-context hidden></p>
        <div class="auth-form__fields">
          <div class="auth-form__field">
            <label for="register-name">Name</label>
            <input id="register-name" name="name" type="text" placeholder="Your name" autocomplete="given-name" maxlength="50" required />
          </div>
          <div class="auth-form__field">
            <label for="register-surname">Surname</label>
            <input id="register-surname" name="surname" type="text" placeholder="Your surname" autocomplete="family-name" maxlength="50" required />
          </div>
          <div class="auth-form__field">
            <label for="register-phone">Phone</label>
            <input id="register-phone" name="phone" type="tel" placeholder="+998" autocomplete="tel" required />
          </div>
          <div class="auth-form__field">
            <label for="register-email">Email</label>
            <input id="register-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required />
          </div>
          <div class="auth-form__field">
            <label for="register-password">Password</label>
            <input id="register-password" name="password" type="password" placeholder="Create a password" autocomplete="new-password" minlength="4" maxlength="64" required />
          </div>
          <div class="auth-form__field">
            <label for="register-password-confirm">Confirm password</label>
            <input id="register-password-confirm" name="password-confirm" type="password" placeholder="Repeat your password" autocomplete="new-password" minlength="4" maxlength="64" required />
          </div>
        </div>
        <button class="auth-form__submit" type="submit">Register</button>
        <p class="auth-error" data-auth-error role="alert" hidden></p>
        <p class="auth-switch">Already registered? <a href="login.html" data-auth-switch>Log in</a></p>
      </form>
    </main>
  </body>
</html>
